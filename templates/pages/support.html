{{partial:nav}}
    <main id="main{{var:idSuffix}}" class="page">
        <div class="page__head">
            <h1>{{var:h1}}</h1>
            <p class="page__sub">{{t:support.sub}}</p>
        </div>
        <div class="faq-list">
            {{faq}}
        </div>
        <aside class="contact-card">
            <h2>{{t:support.contact_title}}</h2>
            <p>{{t:support.contact_body}}</p>
            <p class="contact-card__email"><a href="mailto:support@motify.uk">support@motify.uk</a></p>
            <p class="contact-card__time">{{t:support.contact_time}}</p>
        </aside>
    </main>
{{partial:footer}}
